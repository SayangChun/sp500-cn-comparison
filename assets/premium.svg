<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img"><title>场内溢价</title><rect width="940" height="400" fill="#fbfcfe" rx="10"/><text x="24.0" y="34.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19.0" fill="#1a1d21" text-anchor="start" font-weight="650">场内 ETF 溢价：买场内要多付这笔钱</text><text x="24.0" y="56.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5b636d" text-anchor="start">溢价 = 收盘价 ÷ 单位净值 − 1，取 2026-10-22。溢价越高，同样的钱买到的指数敞口越少。</text><text x="80.0" y="111.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1a1d21" text-anchor="end" font-weight="650">博时ETF</text><rect x="92.0" y="88.0" width="575.00" height="38.00" fill="#2563eb" rx="3"/><text x="657.0" y="111.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#ffffff" text-anchor="end" font-weight="650">8.15%</text><text x="708.0" y="111.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a1d21" text-anchor="start" font-weight="650">有效参与率 92.26%</text><text x="80.0" y="165.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1a1d21" text-anchor="end" font-weight="650">国泰ETF</text><rect x="92.0" y="142.0" width="529.11" height="38.00" fill="#2563eb" rx="3"/><text x="611.1" y="165.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#ffffff" text-anchor="end" font-weight="650">7.50%</text><text x="708.0" y="165.5" font-family="-a