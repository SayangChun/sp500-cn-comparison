<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img"><title>场内溢价</title><rect width="940" height="400" fill="#fbfcfe" rx="10"/><text x="24.0" y="34.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19.0" fill="#1a1d21" text-anchor="start" font-weight="650">场内 ETF 期末溢价：买场内要多付这笔钱</text><text x="24.0" y="56.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5b636d" text-anchor="start">溢价 = 收盘价 ÷ 份额净值 − 1。溢价越高，同样的钱买到的指数敞口越少。</text><text x="80.0" y="111.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1a1d21" text-anchor="end" font-weight="650">国泰ETF</text><rect x="92.0" y="88.0" width="629.14" height="38.00" fill="#2563eb" rx="3"/><text x="730.1" y="112.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a1d21" text-anchor="start" font-weight="650">3.52%　→ 有效参与率 96.37%</text><text x="80.0" y="165.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1a1d21" text-anchor="end" font-weight="650">博时ETF</text><rect x="92.0" y="142.0" width="492.98" height="38.00" fill="#2563eb" rx="3"/><text x="594.0" y="166.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a1d21" text-anchor="start" font-weight="650">2.76%　→ 有效参与率 97.10%</text><text x="80.0" y="219.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1a1d21" text-anchor="end" font-weight="650">华夏ETF</text><rect x="92.0" y="196.0" width="311.83" height="38.00" fill="#2563eb" rx="3"/><text x="412.8" y="220.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a1d21" text-anchor="start" font-weight="650">1.74%　→ 有效参与率 98.29%</text><text x="80.0" y="273.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1a1d21" text-anchor="end" font-weight="650">南方ETF</text><rect x="92.0" y="250.0" width="273.17" height="38.00" fill="#2563eb" rx="3"/><text x="374.2" y="274.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a1d21" text-anchor="start" font-weight="650">1.53%　→ 有效参与率 98.42%</text><line x1="92.0" y1="88" x2="92.0" y2="304" stroke="#e6e9ee" stroke-width="1"/><text x="92.0" y="321.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">0%</text><line x1="270.9" y1="88" x2="270.9" y2="304" stroke="#e6e9ee" stroke-width="1"/><text x="270.9" y="321.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">1%</text><line x1="449.7" y1="88" x2="449.7" y2="304" stroke="#e6e9ee" stroke-width="1"/><text x="449.7" y="321.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">2%</text><line x1="628.6" y1="88" x2="628.6" y2="304" stroke="#e6e9ee" stroke-width="1"/><text x="628.6" y="321.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">3%</text><line x1="807.5" y1="88" x2="807.5" y2="304" stroke="#e6e9ee" stroke-width="1"/><text x="807.5" y="321.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">4%</text><text x="496.0" y="344.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.0" fill="#5b636d" text-anchor="middle">2026-06-30 期末溢价率</text><text x="24.0" y="386.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.0" fill="#8b939d" text-anchor="start">口径提醒：QDII 净值有 T+1 披露时滞，同日「收盘价 ÷ 净值」会把隔夜美股涨跌算进溢价。严谨计算应用「价格(T) ÷ 净值(T-1)」，两个口径都要看。</text></svg>