chor="middle">7%</text><line x1="656.4" y1="88" x2="656.4" y2="304" stroke="#e6e9ee" stroke-width="1"/><text x="656.4" y="321.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">8%</text><text x="391.0" y="344.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.0" fill="#5b636d" text-anchor="middle">2026-10-22 溢价率</text><text x="24.0" y="386.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.0" fill="#8b939d" text-anchor="start">口径提醒：QDII 净值有 T+1 披露时滞，同日「收盘价 ÷ 净值」会把隔夜美股涨跌算进溢价。严谨计算应用「价格(T) ÷ 净值(T-1)」，两个口径都要看。</text></svg>