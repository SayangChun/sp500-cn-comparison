f" font-size="11.0" fill="#8b939d" text-anchor="start">ρ 的算法：ρ = 1 − 6Σd² / (n(n²−1))，d 为同一只基金两侧的名次差；ρ = 1 表示完全一致，0 表示完全无关。</text></svg>