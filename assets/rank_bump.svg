<svg xmlns="http://www.w3.org/2000/svg" width="940" height="664" viewBox="0 0 940 664" role="img"><title>费率排名与收益排名对照</title><rect width="940" height="664" fill="#fbfcfe" rx="10"/><text x="24.0" y="34.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19.0" fill="#1a1d21" text-anchor="start" font-weight="650">低费率 ≠ 好结果：费率排名与三年收益排名对照</text><text x="24.0" y="56.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5b636d" text-anchor="start">左边按加权综合费率从低到高排，右边按过去三年收益从高到低排，连线越斜说明错位越大。</text><text x="24.0" y="80.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="650">Spearman 秩相关 ρ = 0.30 —— 两者只有弱相关，费率低并不能保证收益高。</text><text x="352.0" y="102.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.0" fill="#5b636d" text-anchor="end" font-weight="650">费率排名（1 = 最低）</text><text x="596.0" y="102.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.0" fill="#5b636d" text-anchor="start" font-weight="650">三年收益排名（1 = 最高）</text><line x1="352" y1="132.0" x2="596" y2="132.0" stroke="#e6e9ee" stroke-width="1"/><line x1="352" y1="178.0" x2="596" y2="178.0" stroke="#e6e9ee" stroke-width="1"/><line x1="352" y1="224.0" x2="596" y2="224.0" stroke="#e6e9ee" stroke-width="1"/><line x1="352" y1="270.0" x2="596" y2="270.0" stroke="#e6e9ee" stroke-width="1"/><line x1="352" y1="316.0" x2="596" y2="316.0" stroke="#e6e9ee" stroke-width="1"/><line x1="352" y1="362.0" x2="596" y2="362.0" stroke="#e6e9ee" stroke-width="1"/><line x1="352" y1="408.0" x2="596" y2="408.0" stroke="#e6e9ee" stroke-width="1"/><line x1="352" y1="454.0" x2="