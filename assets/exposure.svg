Fang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">94%</text><line x1="526.4" y1="92" x2="526.4" y2="474" stroke="#e6e9ee" stroke-width="1"/><text x="526.4" y="491.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">96%</text><line x1="631.8" y1="92" x2="631.8" y2="474" stroke="#e6e9ee" stroke-width="1"/><text x="631.8" y="491.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">98%</text><line x1="737.3" y1="92" x2="737.3" y2="474" stroke="#e6e9ee" stroke-width="1"/><text x="737.3" y="491.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="middle">100%</text><text x="196.0" y="113.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1a1d21" text-anchor="end" font-weight="650">华夏ETF</text><text x="196.0" y="126.0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.0" fill="#8b939d" text-anchor="end">159655</text><rect x="210.0" y="101.0" width="527.23" height="13.00" fill="#0d9488" rx="3"/><text x="744.2" y="111.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a1d21" text-anchor="start" font-weight="650">100.00%</text><rect x="210.0" y="116.0" width="436.88" height="9.00" fill="#99f6e4" rx="3"/><text x="653.9" y="124.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8b939d" text-anchor="start">98.29%</text><text x="196.0" y="151.0" font-family